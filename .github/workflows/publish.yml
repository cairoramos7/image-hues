name: Publish to npm
on:
  release:
    types: [created]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check if package.json version was bumped
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view image-hues version 2>/dev/null || echo "")
          echo "Local package.json version: $PKG_VERSION"
          echo "Latest published version:   ${PUBLISHED_VERSION:-<none>}"
          if [ "$PKG_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm install -g npm@latest
        if: steps.version_check.outputs.changed == 'true'
      - run: npm run build
        if: steps.version_check.outputs.changed == 'true'
      - run: npm publish --access public
        if: steps.version_check.outputs.changed == 'true'
